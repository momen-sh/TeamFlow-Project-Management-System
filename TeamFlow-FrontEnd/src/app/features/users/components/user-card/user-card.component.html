<div class="card">

  <div class="header">

    <h3>{{ fullName }}</h3>

    <span class="role" [ngClass]="user.role">
      {{ user.role }}
    </span>

  </div>

  <p class="email">{{ user.email }}</p>

  <div class="actions">

    <button (click)="onView()">View</button>
    <button (click)="onEdit()">Edit</button>
    <button class="danger" (click)="onDelete()">Delete</button>

  </div>

</div>
